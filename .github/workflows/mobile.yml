# Apps mobiles (Tauri v2) : APK / AAB Android et build iOS.
# Voir docs/mobile.md pour les secrets de signature et la distribution.
name: Apps mobiles

on:
  push:
    branches: [tauri-mobile]
    tags: ['v*']
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'package*.json', '.github/workflows/mobile.yml']
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    permissions:
      contents: write # joindre l'APK à la release (tags v*)
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # le paquet « tools » (installé par défaut) n'existe plus : on n'installe que platform-tools
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clé de signature (si les secrets sont fournis)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "storeFile=$RUNNER_TEMP/upload.jks"
              echo "password=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
            } > src-tauri/gen/android/app/keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pas de secrets ANDROID_KEYSTORE_* : APK release NON signé, APK debug fourni pour tester."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release (APK universel + AAB)
        run: npx tauri android build --apk --aab

      # Sans clé de l'utilisateur, l'APK release n'est pas signé et Android refuse de l'installer
      # (« le package semble ne pas être valide ») : on le signe alors avec une clé de TEST générée ici.
      # Installable pour essayer ; pour publier, fournir les secrets ANDROID_KEYSTORE_* (voir docs/mobile.md).
      - name: APK installable
        run: |
          mkdir -p dist-android
          OUT=src-tauri/gen/android/app/build/outputs
          APK=$(ls $OUT/apk/universal/release/*.apk | head -1)
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storepass android -keypass android -alias test \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=EnjoySing test" -noprompt
            "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/test.jks" --ks-pass pass:android --out dist-android/enjoysing-test.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify dist-android/enjoysing-test.apk
          else
            cp "$APK" dist-android/enjoysing.apk
            cp $OUT/bundle/*/*.aab dist-android/enjoysing.aab
          fi
          ls -la dist-android

      - uses: actions/upload-artifact@v7
        with:
          name: enjoysing-android
          path: dist-android/*
          if-no-files-found: error

      # Étiquette v* : l'APK rejoint la release de cette version (brouillon créé par la CI ordinateur,
      # ou créé ici), sous un nom fixe que le site de présentation (landing/) sait retrouver.
      - name: Joindre l'APK à la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          APK=$(ls dist-android/enjoysing.apk dist-android/enjoysing-test.apk 2>/dev/null | head -1)
          cp "$APK" "$RUNNER_TEMP/EnjoySing-android.apk"
          # les brouillons ne sont pas trouvables par leur étiquette : on cherche dans la liste
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$ID" ]; then
            ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="EnjoySing ${TAG#v}" -F draft=true \
              -f body="Voir docs/mobile.md et docs/desktop.md pour l'installation." --jq .id)
          fi
          # remplace l'APK s'il y est déjà (nouvel essai de la CI)
          OLD=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --jq '.[] | select(.name == "EnjoySing-android.apk") | .id')
          [ -n "$OLD" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD"
          UPLOAD=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq .upload_url | sed 's/{.*}//')
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$RUNNER_TEMP/EnjoySing-android.apk" "$UPLOAD?name=EnjoySing-android.apk" > /dev/null
          echo "APK joint à la release $TAG (à publier à la main si c'est un brouillon)."

  ios:
    name: iOS (simulateur, non signé)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # le contexte « secrets » n'est pas lisible dans les conditions « if » des étapes
      # build signé seulement avec une clé API App Store Connect (profils créés automatiquement)
      HAS_APPLE_TEAM: ${{ secrets.APPLE_API_KEY != '' && (secrets.APPLE_DEVELOPMENT_TEAM != '' || secrets.APPLE_TEAM_ID != '') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Le projet Xcode n'est pas versionné (il ne peut être créé que sur macOS) : on le crée ici.
      # Les réglages propres à l'app (micro…) viennent de src-tauri/Info.ios.plist.
      - name: tauri ios init
        run: |
          if [ ! -d src-tauri/gen/apple ]; then npx tauri ios init --ci; fi

      - name: Build simulateur (sans signature)
        if: env.HAS_APPLE_TEAM != 'true'
        run: npx tauri ios build --target aarch64-sim --debug --ci

      # Avec un compte Apple Developer (voir docs/mobile.md) : build signé pour TestFlight.
      - name: Build signé (IPA)
        if: env.HAS_APPLE_TEAM == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          export APPLE_API_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          npx tauri ios build --export-method app-store-connect --ci

      - uses: actions/upload-artifact@v7
        with:
          name: enjoysing-ios
          path: |
            src-tauri/gen/apple/build/**/*.app
            src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: warn
